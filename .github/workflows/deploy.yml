name: Deploy

on:
  push:
    branches: [main, CICD]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  EC2_USER:                       ubuntu
  ECR_REPO_SERVER:                maple-garden-server-staging
  ECR_REPO_PROXY:                 maple-garden-proxy-staging
  VITE_TENANT_NAME:               maple-garden
  VITE_SENTRY_TRACES_SAMPLE_RATE: "0.1"

jobs:

  # ─── Build Docker images → push to ECR ──────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      registry: ${{ steps.ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo "--- OIDC token payload ---"
          echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null || echo $TOKEN | cut -d. -f2 | base64 -id 2>/dev/null
          echo "--------------------------"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push server
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f server/Dockerfile \
            -t "$REGISTRY/$ECR_REPO_SERVER:$TAG" \
            -t "$REGISTRY/$ECR_REPO_SERVER:latest" .
          docker push "$REGISTRY/$ECR_REPO_SERVER:$TAG"
          docker push "$REGISTRY/$ECR_REPO_SERVER:latest"

      - name: Build & push proxy
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f routing/Dockerfile \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}" \
            --build-arg VITE_API_URL="" \
            --build-arg VITE_SENTRY_DSN="${{ secrets.VITE_SENTRY_DSN }}" \
            --build-arg VITE_SENTRY_TRACES_SAMPLE_RATE="$VITE_SENTRY_TRACES_SAMPLE_RATE" \
            --build-arg VITE_TENANT_NAME="$VITE_TENANT_NAME" \
            -t "$REGISTRY/$ECR_REPO_PROXY:$TAG" \
            -t "$REGISTRY/$ECR_REPO_PROXY:latest" .
          docker push "$REGISTRY/$ECR_REPO_PROXY:$TAG"
          docker push "$REGISTRY/$ECR_REPO_PROXY:latest"

  # ─── Deploy to EC2 ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker pull ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPO_SERVER }}:latest
            docker pull ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPO_PROXY }}:latest

            cd /app
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Smoke test
        run: |
          sleep 20
          curl -sf "https://${{ secrets.DOMAIN }}/api/health" \
            && echo "Smoke test passed" \
            || (echo "Smoke test failed" && exit 1)
