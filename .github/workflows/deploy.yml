<body>

<header>
    <h1>מדריך ארכיטקטורה ולוגיקה: Backend רישוי דיגיטלי</h1>
    <p>הכנה לסקירת קוד והצגת ה-MVP | מאת: מרים</p>
</header>

<div class="container">

    <!-- Section 1: Lifecycle -->
    <div class="section-card">
        <h2>1. מחזור החיים המלא (Main Lifecycle)</h2>
        <p>מחזור החיים של רישיון הוא "מכונת המצבים" (State Machine) של המערכת. הוא נועד להבטיח שרישיון לא ילך לאיבוד, לא יימכר פעמיים, ושתמיד נדע איפה הוא נמצא.</p>
        
        <h3>Intake (קליטה)</h3>
        <p><strong>מה זה אומר:</strong> הרגע שבו ספק או מנהל מכניסים קוד רישיון חדש למערכת.</p>
        <p><strong>בקוד:</strong> הרישיון מיד עובר הצפנה (Encryption at rest). הוא לא נשמר כטקסט גלוי אפילו לשנייה אחת. הסטטוס שלו מוגדר כ-<code>Available</code> (זמין למכירה).</p>

        <h3>Reserve (שריון)</h3>
        <p><strong>מה זה אומר:</strong> לקוח ביצע הזמנה, והמערכת "תופסת" עבורו רישיון ספציפי מהמלאי כדי שאף אחד אחר לא יקנה אותו במקביל.</p>
        <p><strong>בקוד:</strong> הסטטוס עובר ל-<code>Reserved</code>, והמערכת משייכת את ה-ID של הרישיון להזמנה של הלקוח. זה מונע מצב של Double-Spending (כפל מכירה).</p>

        <h3>Deliver (מסירה)</h3>
        <p><strong>מה זה אומר:</strong> הרישיון נמסר פיזית (או דיגיטלית במייל/פורטל) ללקוח.</p>
        <p><strong>בקוד:</strong> הסטטוס משתנה ל-<code>Delivered</code>. בשלב זה הלקוח קיבל בעלות על המפתח, והמערכת רושמת את זה ב-Ledger (יומן התנועות).</p>

        <h3>Activate (הפעלה)</h3>
        <p><strong>מה זה אומר:</strong> הלקוח לקח את הקוד והזין אותו בתוכנה (למשל אופיס או אנטי-וירוס). הקוד הפך לפעיל.</p>
        <p><strong>בקוד:</strong> הסטטוס עובר ל-<code>Active</code>. מרגע זה מתחיל לפעול "שעון החיים" של הרישיון (תוקף, תאריך חידוש למנוי).</p>

        <h3>Reveal (חשיפה)</h3>
        <p><strong>מה זה אומר:</strong> משתמש במערכת (מנהל/נציג תמיכה) רוצה לראות את הקוד הגלוי בעיניים שלו (למשל כדי להקריא ללקוח בטלפון).</p>
        <p><strong>בקוד:</strong> זו הפעולה הרגישה ביותר. היא <strong>דורשת</strong> רישום תיעוד (Audit) לפני הפענוח (מי לחץ, מתי, מה ה-IP, ומה סיבת החשיפה). אם הרישיון מוגדר כ-High-Risk, הפעולה נעצרת ודורשת <code>ApproveHighRisk</code> (אישור מנהל).</p>
    </div>

    <!-- Section 2: Security -->
    <div class="section-card">
        <h2>2. אבטחה, הצפנה וקונפיגורציות</h2>
        <p>האבטחה היא לב המערכת. אנחנו לא מנהלים כאן סתם טקסטים, אלא כסף (רישיונות שעולים הרבה מאוד כסף).</p>

        <h3>למה <code>ILicenseSecretProtector</code> קיים?</h3>
        <p>כדי שמתכנתים אחרים לא יעשו טעויות. בעבר, שירותים (AppServices) קראו ישירות לשירות ההצפנה הגנרי כדי לפענח קוד. <code>ILicenseSecretProtector</code> מרכז את כל הגישה לסודות למקום אחד בלבד. הוא מהווה "שער" שמוודא שאי אפשר לפענח רישיון בלי לבצע Audit ולבדוק הרשאות. זה מונע מעקפים (Bypassing).</p>

        <h3>מה המשמעות של <code>SearchHashPepper</code>?</h3>
        <p>מכיוון שהרישיונות מוצפנים, איך נוכל לבדוק אם קוד שהספק העלה עכשיו כבר קיים במערכת (למנוע כפילויות)? אי אפשר לחפש טקסט מוצפן כי כל הצפנה מייצרת מחרוזת שונה. הפתרון הוא לגזור <strong>Hash</strong> מהקוד הגלוי בזמן הקליטה ולשמור אותו בעמודה נפרדת. ה-<strong>Pepper</strong> הוא מחרוזת סודית שמוספת לקוד לפני הגיבוב (Hashing), כך שגם אם מישהו פורץ למסד הנתונים ורואה את ה-Hash, הוא לא יכול להפעיל מתקפת Rainbow Table כדי לנחש מה הקוד המקורי.</p>

        <h3>ההבדל בין <code>Local</code> ל-<code>Configured</code> Protector</h3>
        <div class="highlight-box">
            <ul>
                <li><strong><code>LocalLicenseSecretProtector</code>:</strong> משמש לסביבת פיתוח מקומית (Dev). הוא משתמש במפתח קבוע או זמני כדי שיהיה נוח לפתח בלי להרים תשתית אבטחה כבדה.</li>
                <li><strong><code>ConfiguredLicenseSecretProtector</code>:</strong> משמש לסביבת ייצור (Production). הוא מתממשק למערכת Data Protection אמיתית (כמו AWS KMS או Azure Key Vault) שמנהלת את מפתחות ההצפנה. המערכת מוגדרת ל-Fail-Fast (לקרוס מיד) אם מנסים להריץ את ה-Local בסביבת ייצור.</li>
            </ul>
        </div>

        <h3>שינויים ב-<code>PlatformModule</code></h3>
        <p>מודול זה שונה כדי להזריק (Dependency Injection) את ה-Protector הנכון לפי הסביבה (פיתוח לעומת ייצור), וכדי להגדיר את אופן שמירת המפתחות (<code>PersistKeysToDbContext</code>) כך שמפתחות ההצפנה ישרדו נפילת שרת ולא נאבד גישה לרישיונות.</p>
    </div>

    <!-- Section 3: Entities & Services -->
    <div class="section-card">
        <h2>3. ישויות ושירותים</h2>
        
        <h3><code>LicenseStockItem</code></h3>
        <p><strong>תפקיד:</strong> הישות המרכזית (Entity) במסד הנתונים המייצגת רישיון פיזי/דיגיטלי אחד במחסן.</p>
        <p><strong>בקוד:</strong> מכילה את הסוד המוצפן עצמו (כמחרוזת ג'יבריש), את ה-SearchHash (למניעת כפילויות), את הסטטוס הנוכחי, ואת ה-Tenant ID (כדי להפריד בין חברות שונות במערכת).</p>

        <h3><code>LicenseStockStatus</code></h3>
        <p><strong>תפקיד:</strong> Enum (רשימת קבועים) המגדיר את 9 המצבים האפשריים שבהם רישיון יכול להימצא (Available, Reserved, Delivered וכו'). הוא הבסיס למכונת המצבים ומונע מעבר מסטטוס א' ל-ג' ללא מעבר ב-ב'.</p>

        <h3><code>LicenseStockItemAppService</code></h3>
        <p><strong>תפקיד:</strong> שכבת ה-API שמקשרת בין מסכי ה-Frontend לבין מסד הנתונים.</p>
        <p><strong>בקוד:</strong> כאן מתבצעת אכיפת ההרשאות (RBAC). השירות הזה מכיל את מתודות ה-Deliver וה-Activate שהיו חסרות בעבר, ומוודא שרק משתמש עם הרשאה מתאימה יכול לשנות סטטוס של רישיון או לשלוף אותו.</p>
    </div>

    <!-- Section 4: Testing -->
    <div class="section-card">
        <h2>4. טסטים ובדיקות תוכנה</h2>

        <h3>מה נבדק ב-<code>LicenseStockItemAppServiceTests</code>?</h3>
        <p>אלו הם Unit Tests שבודקים את הלוגיקה העסקית בסביבה מבודדת. הם מוודאים:</p>
        <ul>
            <li>שאי אפשר לבצע מעבר סטטוס לא חוקי (למשל להפעיל רישיון שעוד לא נמסר), ושהמערכת זורקת שגיאת <code>409 Conflict</code>.</li>
            <li>שתהליך ה-High-Risk באמת עוצר את החשיפה עד לקבלת אישור.</li>
            <li>שמשתמש בלי הרשאה לא יכול לקרוא לשירות (בדיקת RBAC).</li>
        </ul>

        <h3>הסבר על טסטי האינטגרציה (Integration Tests)</h3>
        <p>טסטי האינטגרציה (שדורשים DB אמיתי או Docker) הם קריטיים להוכחת ה-MVP כי הם בודקים את <strong>המערכת בשלמותה</strong>. הם מוכיחים ש:</p>
        <ol>
            <li><strong>הצפנה בפועל (Round-trip):</strong> הרישיון באמת נשמר מוצפן ב-DB האמיתי (ולא רק בזיכרון), וכששולפים אותו הוא מפוענח נכון.</li>
            <li><strong>אילוצי מסד הנתונים:</strong> שאינדקס ה-Hash הייחודי באמת חוסם ניסיון להכניס קוד כפול ברמת מסד הנתונים.</li>
            <li><strong>בידוד דיירים (Tenant Isolation):</strong> שדייר א' בשום אופן לא יכול לראות מידע מה-DB של דייר ב'.</li>
        </ol>
        <p><em>הערה לפגישה:</em> גם אם Docker עשה בעיות טכניות בהרצה מקומית, הלוגיקה שכתובה בטסטים היא ההוכחה הארכיטקטונית לכך שהמערכת עומדת בדרישות האבטחה המחמירות ביותר.</p>
    </div>

    <!-- Section 5: MVP -->
    <div class="section-card">
        <h2>5. עמידה בדרישות ה-MVP של נתנאל</h2>

        <h3>חיבור לתרחיש הזהב (Golden Scenario)</h3>
        <p>ה-MVP של רישוי דיגיטלי מתנקז למטרה אחת: <strong>אספקה אוטומטית</strong>. כל הלוגיקה והאבטחה שתוארו למעלה מתחברות כדי לאפשר מצב שבו: לקוח משלם על הזמנה -> האירוע <code>SalesOrderConfirmedEto</code> נורה -> המערכת שולפת <code>LicenseStockItem</code> במצב Available -> עושה לו Reserve -> מפעילה את ה-Deliver -> ופולטת אירוע <code>LicenseDeliveredEto</code>. כל זה קורה באלפיות שנייה, ללא מגע יד אדם, תוך שמירה על הצפנה ותיעוד מלא. זהו חוט הזהב.</p>

        <h3>מה היה חסר (ומה הסטטוס העדכני)</h3>
        <div class="highlight-box">
            <p>חלק מהכנות ל-MVP הוא להציג בשקיפות את הפערים. חשוב לשקף בפגישה את הנקודות הבאות:</p>
            <ul>
                <li><strong>ה-Ledger (יומן תנועות המלאי הדיגיטלי):</strong> מנגנון קריטי לתיעוד פיננסי. חשוב לציין: ה-Ledger (<code>DigitalInventoryTransaction</code>) והטסטים שלו (<code>LicenseSalesOrderConfirmedEventHandlerTests</code>) <strong>מוזגו בהצלחה ל-Main ממש הבוקר</strong>, כך שפער זה נסגר רגע לפני ה-MVP!</li>
                <li><strong>כפילות מלאי מול הקטלוג:</strong> עדיין נדרשת החלטה ארכיטקטונית (איחוד בין הישות הישנה <code>LicenseKey</code> לבין <code>LicenseStockItem</code> החדש והמוצפן שלנו).</li>
                <li><strong>הקשחה בסביבת ייצור:</strong> חיבור בפועל ל-Key Vault של מיקרוסופט או AWS KMS בסביבת ה-Production טרם יושם במלואו וממתין להגדרות DevOps.</li>
            </ul>
        </div>
    </div>

</div>

</body>
</html>