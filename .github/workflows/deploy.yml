<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדריך Backend: רישוי דיגיטלי ומנויים</title>
    <style>
        :root {
            --primary: #0d7c86;
            --primary-dark: #0a5d65;
            --secondary: #f4c76b;
            --bg-color: #fbf5ec;
            --card-bg: #ffffff;
            --text-main: #2a2620;
            --text-muted: #6f675c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 5px solid var(--secondary);
        }
        header h1 {
            margin: 0;
            font-size: 32px;
        }
        header p {
            font-size: 18px;
            opacity: 0.9;
            margin-top: 10px;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .section-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #e8ddc9;
        }
        h2 {
            color: var(--primary-dark);
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 10px;
            margin-top: 0;
        }
        h3 {
            color: var(--primary);
            margin-top: 25px;
        }
        code {
            background-color: #f4f4f4;
            color: #d63384;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, monospace;
            direction: ltr;
            display: inline-block;
        }
        .highlight-box {
            background-color: rgba(13, 124, 134, 0.05);
            border-right: 4px solid var(--primary);
            padding: 15px;
            border-radius: 4px;
