name: CI

on:
  workflow_call:
  pull_request:
    branches: [main, miriam]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node writes auth for registry.npmjs.org using NODE_AUTH_TOKEN at install time
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Clear local overrides that can conflict with setup-node auth
          rm -f .npmrc .npmrc.bak
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Typecheck client
        working-directory: client
        run: npm run typecheck

      - name: Unit tests (server)
        working-directory: server
        run: npm test -- --ci --forceExit

      - name: Contract unit tests (node)
        working-directory: server
        run: npm run test:unit

      - name: Security tests
        working-directory: server
        run: npm run test:security

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Build server
        working-directory: server
        run: npm run build
